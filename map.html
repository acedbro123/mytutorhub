<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Send our origin as Referer so Nominatim can identify this site (its usage policy) -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Map — Voluntool</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Leaflet (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
</head>
<body>
  <nav class="section-nav section-nav--inperson">
    <div class="section-nav-inner">
      <a href="index.html" class="section-nav-link">Home</a>
      <a href="map.html" class="section-nav-link active">Map</a>
      <a href="saved-volunteer-ideas.html" class="section-nav-link">Saved Volunteer Ideas</a>
    </div>
  </nav>

  <main class="main">
    <section class="section map-section">
      <div class="map-header">
        <h1>Find a place on the map</h1>
        <p>Search for an address or place to drop a pin. Soon this map will also show nearby in-person volunteering opportunities.</p>
      </div>

      <form id="map-search" class="map-search" role="search" aria-label="Search for an address">
        <input
          id="map-search-input"
          class="map-search__input"
          type="text"
          name="address"
          placeholder="Enter an address, city, or place…"
          autocomplete="off"
          aria-label="Address" />
        <button id="map-search-btn" class="btn btn-inperson map-search__btn" type="submit">Search</button>
      </form>

      <p id="map-message" class="map-message" role="status" aria-live="polite" hidden></p>

      <div id="map" class="map-canvas" aria-label="Interactive map"></div>
    </section>
  </main>

  <!-- Leaflet JS (free, no API key) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script>
    (function () {
      // --- Base layers ---
      // Satellite imagery (Esri World Imagery — free, no API key)
      var satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
          maxZoom: 19,
          attribution: 'Tiles &copy; Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, ' +
            'Getmapping, Aerogrid, IGN, IGP, UPX, and the GIS User Community'
        }
      );

      // Regular street map (OpenStreetMap)
      var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });

      // --- Initialise the map (default view: continental US, satellite by default) ---
      var map = L.map('map', {
        center: [39.8283, -98.5795],
        zoom: 4,
        layers: [satellite]
      });

      // Toggle between Satellite and Street map (top-right)
      L.control.layers(
        { 'Satellite': satellite, 'Street map': streets },
        null,
        { position: 'topright' }
      ).addTo(map);

      var marker = null; // single reusable marker

      var form = document.getElementById('map-search');
      var input = document.getElementById('map-search-input');
      var button = document.getElementById('map-search-btn');
      var message = document.getElementById('map-message');

      function showMessage(text, type) {
        message.textContent = text;
        message.className = 'map-message map-message--' + (type || 'info');
        message.hidden = false;
      }

      function clearMessage() {
        message.hidden = true;
        message.textContent = '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var query = input.value.trim();
        if (!query) {
          showMessage('Please type an address or place to search for.', 'error');
          input.focus();
          return;
        }

        clearMessage();
        button.disabled = true;
        var originalLabel = button.textContent;
        button.textContent = 'Searching…';

        var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
          encodeURIComponent(query);

        fetch(url, {
          headers: { 'Accept': 'application/json' },
          referrerPolicy: 'strict-origin-when-cross-origin'
        })
          .then(function (res) {
            if (!res.ok) {
              var httpErr = new Error('HTTP ' + res.status);
              httpErr.status = res.status;
              throw httpErr;
            }
            return res.json();
          })
          .then(function (results) {
            if (!results || results.length === 0) {
              showMessage('We couldn’t find that address. Try adding a city/state, or check the spelling.', 'error');
              return;
            }

            var place = results[0];
            var lat = parseFloat(place.lat);
            var lng = parseFloat(place.lon);

            map.flyTo([lat, lng], 16, { duration: 1.25 });

            if (marker) {
              marker.setLatLng([lat, lng]);
            } else {
              marker = L.marker([lat, lng]).addTo(map);
            }
            marker.bindPopup(place.display_name).openPopup();

            showMessage('Showing: ' + place.display_name, 'success');
          })
          .catch(function (err) {
            if (window.console) console.error('Voluntool map geocoding failed:', err);
            if (err && err.status === 403) {
              showMessage('The free map search service is temporarily busy and blocked this request. Please wait a few seconds and try again.', 'error');
            } else if (err && err.status) {
              showMessage('The map search service returned an error (' + err.status + '). Please try again in a moment.', 'error');
            } else {
              showMessage('Couldn’t reach the map search service. Check your internet connection and try again.', 'error');
            }
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = originalLabel;
          });
      });

      // ------------------------------------------------------------------
      // Organization markers (loaded from orgs.json)
      // ------------------------------------------------------------------
      // orgs.json is an array of organizations. Each entry looks like:
      //
      //   {
      //     "name": "Reading Partners",                 // required
      //     "description": "One-on-one reading tutoring for K–5 students.",
      //     "website": "https://readingpartners.org",
      //     "lat": 37.7749,                             // preferred: exact coords
      //     "lng": -122.4194
      //   }
      //
      // If you omit "lat"/"lng" but provide an "address", the pin is geocoded
      // on page load (throttled to respect the free Nominatim usage policy):
      //
      //   { "name": "...", "address": "123 Main St, City, ST", ... }
      //
      // An empty list ( [] ) simply shows no organization pins.

      var orgMarkers = [];

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function orgPopupHtml(org) {
        var html = '<strong>' + escapeHtml(org.name || 'Organization') + '</strong>';
        if (org.description) html += '<br>' + escapeHtml(org.description);
        if (org.address) html += '<br><span style="color:#64748B;">' + escapeHtml(org.address) + '</span>';
        if (org.website) {
          html += '<br><a href="' + encodeURI(org.website) + '" target="_blank" rel="noopener">Visit website ↗</a>';
        }
        return html;
      }

      function addOrgMarker(org, lat, lng) {
        var m = L.circleMarker([lat, lng], {
          radius: 9,
          color: '#065F46',
          weight: 2,
          fillColor: '#059669',
          fillOpacity: 0.9
        }).addTo(map);
        m.bindPopup(orgPopupHtml(org));
        orgMarkers.push(m);
      }

      function fitToOrgs() {
        if (orgMarkers.length === 0) return;
        map.fitBounds(L.featureGroup(orgMarkers).getBounds().pad(0.2));
      }

      // Geocode any address-only orgs one at a time (~1 req/sec per Nominatim policy).
      function geocodeOrgQueue(items, onDone) {
        var i = 0;
        (function next() {
          if (i >= items.length) { onDone(); return; }
          var org = items[i++];
          fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
            encodeURIComponent(org.address), { headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (res) {
              if (res && res.length) {
                addOrgMarker(org, parseFloat(res[0].lat), parseFloat(res[0].lon));
              } else if (window.console) {
                console.warn('Voluntool map: could not geocode org address:', org.address);
              }
            })
            .catch(function () {
              if (window.console) console.warn('Voluntool map: geocode failed for', org.address);
            })
            .finally(function () { setTimeout(next, 1100); });
        })();
      }

      fetch('orgs.json', { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (orgs) {
          if (!Array.isArray(orgs) || orgs.length === 0) return; // no pins yet — expected
          var needGeocode = [];
          orgs.forEach(function (org) {
            if (typeof org.lat === 'number' && typeof org.lng === 'number') {
              addOrgMarker(org, org.lat, org.lng);
            } else if (org.address) {
              needGeocode.push(org);
            } else if (window.console) {
              console.warn('Voluntool map: skipping org with no coordinates or address:', org.name);
            }
          });
          fitToOrgs(); // frame the ready-to-plot pins immediately
          if (needGeocode.length) geocodeOrgQueue(needGeocode, fitToOrgs);
        })
        .catch(function () {
          if (window.console) {
            console.warn('Voluntool map: orgs.json not found or invalid — no organization pins loaded.');
          }
        });
    })();
  </script>
</body>
</html>
