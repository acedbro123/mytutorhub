<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Send our origin as Referer so Nominatim can identify this site (its usage policy) -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Map — Voluntool</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Leaflet (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
</head>
<body>
  <nav class="section-nav section-nav--inperson">
    <div class="section-nav-inner">
      <a href="index.html" class="section-nav-link">Home</a>
      <a href="map.html" class="section-nav-link active">Map</a>
      <a href="saved-volunteer-ideas.html" class="section-nav-link">Saved Volunteer Ideas</a>
    </div>
  </nav>

  <main class="main">
    <section class="section map-section">
      <div class="map-header">
        <h1>Find volunteer opportunities near you</h1>
        <p>Enter your address to see nearby in-person volunteering organizations, sorted by distance. Adjust the radius to widen or narrow your search.</p>
      </div>

      <form id="map-search" class="map-search" role="search" aria-label="Search for an address">
        <input
          id="map-search-input"
          class="map-search__input"
          type="text"
          name="address"
          placeholder="Enter your address, city, or place…"
          autocomplete="off"
          aria-label="Address" />
        <button id="map-search-btn" class="btn btn-inperson map-search__btn" type="submit">Search</button>
      </form>

      <div class="map-controls">
        <div class="map-control map-control--radius">
          <label for="radius-range">Within</label>
          <input id="radius-range" type="range" min="0" max="100" step="1" value="25" aria-label="Search radius in miles" />
          <span class="radius-value"><strong id="radius-value">25</strong> mi</span>
        </div>
        <div class="map-control">
          <label for="age-select">My age</label>
          <select id="age-select" aria-label="Your age">
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16" selected>16</option>
            <option value="17">17</option>
            <option value="99">18 or older</option>
          </select>
        </div>
        <div class="map-control">
          <label for="hours-select">Hours/week</label>
          <select id="hours-select" aria-label="Hours per week you can volunteer">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="40">10+</option>
          </select>
        </div>
      </div>

      <p id="map-message" class="map-message" role="status" aria-live="polite" hidden></p>

      <div class="map-layout">
        <div id="map" class="map-canvas" aria-label="Interactive map"></div>
        <aside class="map-sidebar" aria-label="Nearby organizations">
          <div class="map-sidebar__head">Nearby organizations</div>
          <div id="org-list" class="org-list">
            <p class="org-list__empty">Enter your address above to see organizations near you.</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Leaflet JS (free, no API key) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <!-- Organization data (edit orgs.js to add your own) -->
  <script src="orgs.js"></script>
  <script>
    (function () {
      // ----------------------------------------------------------------
      // Base layers
      // ----------------------------------------------------------------
      // Satellite imagery (Esri World Imagery — free, no API key).
      // maxNativeZoom caps the highest zoom level for which real tiles exist;
      // maxZoom lets the map zoom in a little further by upscaling the sharpest
      // available tile instead of requesting non-existent (grey/blurry) ones.
      var satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
          maxNativeZoom: 18,
          maxZoom: 20,
          attribution: 'Tiles &copy; Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, ' +
            'Getmapping, Aerogrid, IGN, IGP, UPX, and the GIS User Community'
        }
      );

      // Regular street map (OpenStreetMap)
      var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxNativeZoom: 19,
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });

      // Initialise the map (default view: Beverly Hills, satellite by default)
      var map = L.map('map', {
        center: [34.0736, -118.4004],
        zoom: 13,
        maxZoom: 20,
        layers: [satellite]
      });

      L.control.layers(
        { 'Satellite': satellite, 'Street map': streets },
        null,
        { position: 'topright' }
      ).addTo(map);

      // ----------------------------------------------------------------
      // State + DOM
      // ----------------------------------------------------------------
      var userMarker = null;         // marker for the searched address
      var userLatLng = null;         // [lat, lng] of the searched address
      var orgs = [];                 // all organizations from orgs.js
      var orgLayer = L.layerGroup().addTo(map); // markers currently shown
      var shownMarkers = [];         // parallel to the rendered list

      // Filter state
      var radiusMiles = 25;
      var userAge = 16;
      var userHours = 5;

      var form = document.getElementById('map-search');
      var input = document.getElementById('map-search-input');
      var button = document.getElementById('map-search-btn');
      var message = document.getElementById('map-message');
      var listEl = document.getElementById('org-list');
      var radiusRange = document.getElementById('radius-range');
      var radiusValue = document.getElementById('radius-value');
      var ageSelect = document.getElementById('age-select');
      var hoursSelect = document.getElementById('hours-select');

      function showMessage(text, type) {
        message.textContent = text;
        message.className = 'map-message map-message--' + (type || 'info');
        message.hidden = false;
      }
      function clearMessage() {
        message.hidden = true;
        message.textContent = '';
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // Great-circle distance between two points, in miles (haversine).
      function distanceMiles(lat1, lng1, lat2, lng2) {
        var R = 3958.8; // Earth radius in miles
        var toRad = Math.PI / 180;
        var dLat = (lat2 - lat1) * toRad;
        var dLng = (lng2 - lng1) * toRad;
        var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
          Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function orgPopupHtml(org, dist) {
        var html = '<strong>' + escapeHtml(org.name || 'Organization') + '</strong>';
        if (typeof dist === 'number') html += '<br>' + dist.toFixed(1) + ' miles away';
        if (org.category) html += '<br><em>' + escapeHtml(org.category) + '</em>';
        if (org.description) html += '<br>' + escapeHtml(org.description);
        if (org.address) html += '<br><span style="color:#64748B;">' + escapeHtml(org.address) + '</span>';
        if (org.link) {
          html += '<br><a href="' + encodeURI(org.link) + '" target="_blank" rel="noopener">Visit website ↗</a>';
        }
        return html;
      }

      // ----------------------------------------------------------------
      // Render the sidebar list + org markers for the current radius
      // ----------------------------------------------------------------
      function renderOrgs() {
        orgLayer.clearLayers();
        shownMarkers = [];
        listEl.innerHTML = '';

        if (!userLatLng) {
          listEl.innerHTML = '<p class="org-list__empty">Enter your address above to see organizations near you.</p>';
          return;
        }

        // Tag with distance, then filter by radius AND age AND weekly hours,
        // and sort nearest-first.
        var nearby = orgs
          .map(function (org) {
            return {
              org: org,
              dist: distanceMiles(userLatLng[0], userLatLng[1], org.latitude, org.longitude)
            };
          })
          .filter(function (item) {
            return item.dist <= radiusMiles &&
              item.org.minAge <= userAge &&
              item.org.weeklyHoursRequired <= userHours;
          })
          .sort(function (a, b) { return a.dist - b.dist; });

        if (nearby.length === 0) {
          listEl.innerHTML = '<p class="org-list__empty">No organizations match your filters. ' +
            'Try widening the radius, raising your available hours, or your age.</p>';
          return;
        }

        nearby.forEach(function (item) {
          var org = item.org;

          // marker
          var m = L.circleMarker([org.latitude, org.longitude], {
            radius: 9, color: '#065F46', weight: 2, fillColor: '#059669', fillOpacity: 0.9
          });
          m.bindPopup(orgPopupHtml(org, item.dist));
          m.addTo(orgLayer);
          shownMarkers.push(m);

          // sidebar card
          var card = document.createElement('div');
          card.className = 'org-card';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          var linkHtml = org.link
            ? '<a class="org-card__link" href="' + encodeURI(org.link) +
              '" target="_blank" rel="noopener">Visit website ↗</a>'
            : '';
          card.innerHTML =
            '<div class="org-card__top">' +
              '<span class="org-card__name">' + escapeHtml(org.name || 'Organization') + '</span>' +
              '<span class="org-card__dist">' + item.dist.toFixed(1) + ' mi</span>' +
            '</div>' +
            (org.category ? '<span class="org-card__cat">' + escapeHtml(org.category) + '</span>' : '') +
            (org.description ? '<p class="org-card__desc">' + escapeHtml(org.description) + '</p>' : '') +
            linkHtml;

          function focusOrg() {
            map.flyTo([org.latitude, org.longitude], 17, { duration: 1 });
            m.openPopup();
            // On mobile the map sits above the list — bring it into view.
            document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          // Clicking the external link should NOT trigger the fly-to.
          card.addEventListener('click', function (e) {
            if (e.target.closest('.org-card__link')) return;
            focusOrg();
          });
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusOrg(); }
          });

          listEl.appendChild(card);
        });
      }

      // Update the status line to reflect the current filtered count.
      function summarize() {
        if (!userLatLng) return;
        var count = listEl.querySelectorAll('.org-card').length;
        showMessage(count + ' organization' + (count === 1 ? '' : 's') +
          ' match your filters (within ' + radiusMiles + ' miles).', 'success');
      }

      // ----------------------------------------------------------------
      // Address search (geocode via free Nominatim API)
      // ----------------------------------------------------------------
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var query = input.value.trim();
        if (!query) {
          showMessage('Please type an address or place to search for.', 'error');
          input.focus();
          return;
        }

        clearMessage();
        button.disabled = true;
        var originalLabel = button.textContent;
        button.textContent = 'Searching…';

        var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
          encodeURIComponent(query);

        fetch(url, {
          headers: { 'Accept': 'application/json' },
          referrerPolicy: 'strict-origin-when-cross-origin'
        })
          .then(function (res) {
            if (!res.ok) {
              var httpErr = new Error('HTTP ' + res.status);
              httpErr.status = res.status;
              throw httpErr;
            }
            return res.json();
          })
          .then(function (results) {
            if (!results || results.length === 0) {
              showMessage('We couldn’t find that address. Try adding a city/state, or check the spelling.', 'error');
              return;
            }

            var place = results[0];
            var lat = parseFloat(place.lat);
            var lng = parseFloat(place.lon);
            userLatLng = [lat, lng];

            // zoom to ~17 (neighborhood/house level) so buildings are visible
            map.flyTo([lat, lng], 17, { duration: 1.25 });

            if (userMarker) {
              userMarker.setLatLng([lat, lng]);
            } else {
              userMarker = L.marker([lat, lng]).addTo(map);
            }
            userMarker.bindPopup('Your location: ' + escapeHtml(place.display_name));

            renderOrgs();
            summarize();
          })
          .catch(function (err) {
            if (window.console) console.error('Voluntool map geocoding failed:', err);
            if (err && err.status === 403) {
              showMessage('The free map search service is temporarily busy and blocked this request. Please wait a few seconds and try again.', 'error');
            } else if (err && err.status) {
              showMessage('The map search service returned an error (' + err.status + '). Please try again in a moment.', 'error');
            } else {
              showMessage('Couldn’t reach the map search service. Check your internet connection and try again.', 'error');
            }
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = originalLabel;
          });
      });

      // Filters — update the list + markers live once an address is set.
      radiusRange.addEventListener('input', function () {
        radiusMiles = parseInt(radiusRange.value, 10);
        radiusValue.textContent = radiusMiles;
        if (userLatLng) { renderOrgs(); summarize(); }
      });
      ageSelect.addEventListener('change', function () {
        userAge = parseInt(ageSelect.value, 10);
        if (userLatLng) { renderOrgs(); summarize(); }
      });
      hoursSelect.addEventListener('change', function () {
        userHours = parseInt(hoursSelect.value, 10);
        if (userLatLng) { renderOrgs(); summarize(); }
      });

      // ----------------------------------------------------------------
      // Load organizations from orgs.js (window.VOLUNTOOL_ORGS)
      // ----------------------------------------------------------------
      // Each entry needs at least: name, minAge, weeklyHoursRequired, and
      // either latitude+longitude OR an address (which we geocode on load).
      // See orgs.js for the full field list and how to add your own.
      var GEOCACHE_KEY = 'voluntool_geocache_v1';

      function hasCoords(o) {
        return typeof o.latitude === 'number' && typeof o.longitude === 'number';
      }
      function readGeocache() {
        try { return JSON.parse(localStorage.getItem(GEOCACHE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
      }
      function writeGeocache(cache) {
        try { localStorage.setItem(GEOCACHE_KEY, JSON.stringify(cache)); } catch (e) { /* ignore */ }
      }

      // Geocode any address-only orgs one at a time (~1 req/sec per the Nominatim
      // usage policy), caching each result so we only ever look it up once.
      function geocodeMissing(items, cache) {
        var i = 0;
        (function next() {
          if (i >= items.length) return;
          var org = items[i++];
          var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
            encodeURIComponent(org.address);
          fetch(url, {
            headers: { 'Accept': 'application/json' },
            referrerPolicy: 'strict-origin-when-cross-origin'
          })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (res) {
              if (res && res.length) {
                org.latitude = parseFloat(res[0].lat);
                org.longitude = parseFloat(res[0].lon);
                cache[org.address] = { lat: org.latitude, lng: org.longitude };
                writeGeocache(cache);
                if (userLatLng) { renderOrgs(); summarize(); } // show it once located
              } else if (window.console) {
                console.warn('Voluntool map: could not geocode', org.name, '—', org.address);
              }
            })
            .catch(function () {
              if (window.console) console.warn('Voluntool map: geocode failed for', org.address);
            })
            .finally(function () { setTimeout(next, 1100); });
        })();
      }

      (function loadOrgs() {
        var data = window.VOLUNTOOL_ORGS;
        if (!Array.isArray(data)) {
          if (window.console) {
            console.warn('Voluntool map: orgs.js not loaded or invalid — no organizations loaded.');
          }
          return;
        }
        // Keep entries with the filter fields and either coordinates or an address.
        orgs = data.filter(function (o) {
          return o && typeof o.minAge === 'number' && typeof o.weeklyHoursRequired === 'number' &&
            (hasCoords(o) || (typeof o.address === 'string' && o.address));
        });

        // Fill coordinates for address-only orgs, using the cache when possible.
        var cache = readGeocache();
        var missing = [];
        orgs.forEach(function (o) {
          if (hasCoords(o)) return;
          if (cache[o.address] && typeof cache[o.address].lat === 'number') {
            o.latitude = cache[o.address].lat;
            o.longitude = cache[o.address].lng;
          } else {
            missing.push(o);
          }
        });

        if (userLatLng) renderOrgs(); // in case a search finished first
        if (missing.length) geocodeMissing(missing, cache);
      })();
    })();
  </script>
</body>
</html>
